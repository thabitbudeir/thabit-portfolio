<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Performance: preconnect to CanvasKit CDN before the engine needs it -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Performance: preload the Flutter bootstrap script so it starts ASAP -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- Theme colors so the browser paints the right background immediately (no white flash) -->
  <meta name="theme-color" content="#101214">
  <meta name="color-scheme" content="dark">

  <!-- Primary Meta Tags -->
  <title>Thabit Budeir — Flutter Developer & AI Engineer</title>
  <meta name="title" content="Thabit Budeir — Flutter Developer & AI Engineer">
  <meta name="description" content="Portfolio of Thabit Budeir, a Flutter Developer and AI Engineering student focused on building high-performance mobile products and intelligent systems.">
  <meta name="author" content="Thabit Budeir">
  <meta name="keywords" content="Thabit Budeir, Flutter, Dart, AI, Machine Learning, Mobile Developer, Portfolio, Software Engineer">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thabitbudeir.dev/">
  <meta property="og:title" content="Thabit Budeir — Flutter Developer & AI Engineer">
  <meta property="og:description" content="Explore the portfolio of Thabit Budeir, showcasing expert Flutter development and AI-integrated mobile solutions.">
  <meta property="og:image" content="/icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://thabitbudeir.dev/">
  <meta property="twitter:title" content="Thabit Budeir — Flutter Developer & AI Engineer">
  <meta property="twitter:description" content="Explore the portfolio of Thabit Budeir, showcasing expert Flutter development and AI-integrated mobile solutions.">
  <meta property="twitter:image" content="/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Thabit Budeir">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    /* Initial paint — match site background so there's no white flash before Flutter boots */
    html, body { margin: 0; padding: 0; background: #101214; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Loading splash — visible until Flutter takes over the screen */
    .splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #101214;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .splash.fade-out { opacity: 0; pointer-events: none; }

    /* New Monogram Logo Styles */
    .monogram {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f2f2f0;
      font-family: "Times New Roman", Georgia, serif;
      margin-bottom: 24px;
    }

    .monogram-b {
      position: absolute;
      font-size: 145px;
      font-weight: 400;
      line-height: 1;
      left: 50%;
      top: 50%;
      transform: translate(-42%, -48%);
      letter-spacing: -14px;
      background: linear-gradient(180deg, #ffffff 0%, #d8d8d5 48%, #eeeeeb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 1px rgba(255,255,255,.25), 0 3px 8px rgba(0,0,0,.25);
    }

    .monogram-t {
      position: absolute;
      z-index: 2;
      font-size: 125px;
      font-weight: 400;
      line-height: 1;
      left: 50%;
      top: 50%;
      transform: translate(-58%, -65%);
      letter-spacing: -12px;
      background: linear-gradient(180deg, #ffffff 0%, #d6d6d3 50%, #eeeeeb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 1px rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.25);
    }

    .monogram::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 100px;
      background: linear-gradient(to bottom, transparent, rgba(235,235,232,.9) 15%, rgba(235,235,232,.9) 85%, transparent);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -45%);
      opacity: .65;
      z-index: 1;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #9CA3AF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .splash-text {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255,255,255,0.4); }
    }
  </style>
</head>
<body>
  <!-- Loading splash — removed by Flutter once it's ready -->
  <div class="splash" id="splash">
    <div class="monogram">
      <span class="monogram-b">B</span>
      <span class="monogram-t">T</span>
    </div>
    <div class="spinner"></div>
    <div class="splash-text">Loading…</div>
  </div>

  <script>
    // Once Flutter has rendered its first frame, fade the splash out smoothly.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.classList.add('fade-out');
        setTimeout(function () { s.remove(); }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
